name: Verify that all examples still run
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  discover-examples:
    runs-on: ubuntu-latest
    outputs:
      example_matrix: ${{ steps.discover.outputs.example_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Discover examples
        id: discover
        run: |
          python3 - << 'PY'
          import json
          import os
          import sys
          from pathlib import Path

          try:
            examples_root = Path("examples")
            if not examples_root.exists():
              raise FileNotFoundError("examples directory not found")

            examples = sorted(str(p) for p in examples_root.rglob("*.py"))
            matrix = {"example_location": examples}
            matrix_json = json.dumps(matrix)

            print(f"Discovered {len(examples)} example(s).")
            print(f"example_matrix JSON: {matrix_json}")

            github_output = os.environ.get("GITHUB_OUTPUT")
            if not github_output:
              raise RuntimeError("GITHUB_OUTPUT is not set")

            with open(github_output, "a", encoding="utf-8") as f:
              f.write(f"example_matrix={matrix_json}\n")
          except Exception as exc:
            print(f"Failed to discover examples: {exc}", file=sys.stderr)
            raise
          PY

  run-examples:
    needs: discover-examples
    runs-on: ubuntu-latest
    name: Run example
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-examples.outputs.example_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Fetch all history for git tag
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Get Previous Tag
        id: previous_tag
        uses: "WyriHaximus/github-action-get-previous-tag@v1"
        with:
          fallback: 0.0.1 # Optional fallback tag to use when no tag can be found
          #workingDirectory: another/path/where/a/git/repo/is/checked/out # Optional alternative working directory
      - name: Update version in setup.py
        run: >-
          sed -i "s/{{VERSION_PLACEHOLDER}}/${{ steps.previous_tag.outputs.tag }}/g" setup.py
      - name: Install package
        run: pip install .
      - name: Run the current example
        run: python3 ${{ matrix.example_location }}